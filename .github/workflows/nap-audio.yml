name: Nap phien am va audio

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'So tu xu ly trong lan chay nay'
        required: false
        default: '250'
      max_workers:
        description: 'So luong chay song song (3-8)'
        required: false
        default: '6'
      retries:
        description: 'So lan thu lai moi tu'
        required: false
        default: '2'
      read_timeout:
        description: 'Giay cho phan hoi (API do duoc ~19.7s)'
        required: false
        default: '35'
      retry_dash:
        description: 'Tra lai ca cac dong dang co dau - (1 = co)'
        required: false
        default: '0'

jobs:
  nap-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Lay code ve
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cai thu vien
        run: pip install -r requirements.txt

      - name: Nap phien am va audio
        env:
          GOOGLE_SA_JSON: ${{ secrets.GOOGLE_SA_JSON }}
          SHEET_ID: ${{ vars.SHEET_ID }}
          DICT_PROXY: ${{ vars.DICT_PROXY }}
          DICT_PROXY_SECRET: ${{ secrets.DICT_PROXY_SECRET }}
          BATCH_SIZE: ${{ inputs.batch_size }}
          MAX_WORKERS: ${{ inputs.max_workers }}
          RETRIES: ${{ inputs.retries }}
          READ_TIMEOUT: ${{ inputs.read_timeout }}
          RETRY_DASH: ${{ inputs.retry_dash }}
        run: python seed_audio.py
